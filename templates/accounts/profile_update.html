{% extends "base.html" %}

{% block title %}
Update Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-warning">
                <h3>Update Profile</h3>
            </div>

            <div class="card-body">

                <form method="post"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-warning w-100">
                        Save Changes
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
