{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-info text-white">
                <h3>Change Password</h3>
            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-info w-100">
                        Change Password
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
