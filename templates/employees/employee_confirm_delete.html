{% extends "base.html" %}

{% block title %}
Delete Employee
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h3>

                        Delete Employee

                    </h3>

                </div>

                <div class="card-body">

                    <p class="fs-5">

                        Are you sure you want to delete

                        <strong>

                            {{ employee.user.get_full_name }}

                        </strong>

                        ?

                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <a href="{% url 'employees:employee_list' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-danger">

                            Delete Employee

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
