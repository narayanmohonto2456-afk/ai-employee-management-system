{% extends "base.html" %}

{% block title %}
Delete Leave
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">

            <h4>

                Delete Leave Request

            </h4>

        </div>

        <div class="card-body">

            <p class="fs-5">

                Are you sure you want to delete this leave request?

            </p>

            <form method="post">

                {% csrf_token %}

                <a href="{% url 'leave_management:leave_list' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

                <button type="submit"
                        class="btn btn-danger">

                    Delete

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
